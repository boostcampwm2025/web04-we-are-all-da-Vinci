name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      affected: ${{ steps.affected.outputs.list }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Detect changed paths
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            client:
              - 'client/**'
            server:
              - 'server/**'
            client-toss:
              - 'client-toss/**'
            server-toss:
              - 'server-toss/**'
            packages-shared:
              - 'packages/shared/**'
            packages-similarity:
              - 'packages/similarity/**'
            packages-toss-shared:
              - 'packages/toss-shared/**'
            root:
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'package.json'
              - '.npmrc'
              - '.github/workflows/**'
              - '.github/actions/**'
              - 'scripts/**'
      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Verify affected-workspaces script
        if: steps.filter.outputs.root == 'true'
        run: node --test scripts/affected-workspaces.test.mjs

      - name: Compute affected workspaces
        id: affected
        run: |
          LIST=$(node scripts/affected-workspaces.mjs '${{ steps.filter.outputs.changes }}')
          echo "list=$LIST" >> "$GITHUB_OUTPUT"
          echo "변경된 필터: ${{ steps.filter.outputs.changes }}"
          echo "검증할 워크스페이스: $LIST"

  client:
    name: Client
    needs: changes
    if: >-
      github.event_name == 'push' ||
      contains(fromJSON(needs.changes.outputs.affected), 'client')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          build-packages: "false"

      - name: Lint
        working-directory: client
        run: pnpm run lint

      - name: Format Check
        working-directory: client
        run: pnpm run format:check

      - name: Test with Coverage
        working-directory: client
        run: pnpm run test:coverage

      - name: Coverage Report
        uses: davelosert/vitest-coverage-report-action@v2
        if: github.event_name == 'pull_request'
        with:
          working-directory: client
          json-summary-path: ./coverage/coverage-summary.json
          json-final-path: ./coverage/coverage-final.json

      - name: Build
        working-directory: client
        run: pnpm run build

  server:
    name: Server
    needs: changes
    if: >-
      github.event_name == 'push' ||
      contains(fromJSON(needs.changes.outputs.affected), 'server')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      - name: Lint
        working-directory: server
        run: pnpm run lint

      - name: Format Check
        working-directory: server
        run: pnpm run format:check

      - name: Server Coverage Report
        uses: ArtiomTr/jest-coverage-report-action@v2
        if: github.event_name == 'pull_request'
        with:
          working-directory: server
          package-manager: pnpm
          test-script: pnpm run test:cov

      - name: Build
        working-directory: server
        run: pnpm run build

  client-toss:
    name: Client-Toss
    needs: changes
    if: >-
      github.event_name == 'push' ||
      contains(fromJSON(needs.changes.outputs.affected), 'client-toss')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          build-packages: "false"

      - name: Lint
        working-directory: client-toss
        run: pnpm run lint

      - name: Format Check
        working-directory: client-toss
        run: pnpm run format:check

      - name: Test with Coverage
        working-directory: client-toss
        run: pnpm run test:coverage

      - name: Coverage Report
        uses: davelosert/vitest-coverage-report-action@v2
        if: github.event_name == 'pull_request'
        with:
          working-directory: client-toss
          json-summary-path: ./coverage/coverage-summary.json
          json-final-path: ./coverage/coverage-final.json
          name: client-toss

      - name: Build
        working-directory: client-toss
        run: pnpm run build

      - name: QA Check
        working-directory: client-toss
        run: pnpm run qa:ci

      - name: Generate QA Report
        id: qa-report
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const path = 'client-toss/qa-report.json';
            if (!fs.existsSync(path)) {
              core.setOutput('body', '## 📦 Bundle Size (client-toss)\n\nQA 리포트를 찾을 수 없어요.');
              return;
            }
            const qa = JSON.parse(fs.readFileSync(path, 'utf8'));
            const bundle = qa.results.find((r) => r.name === 'Bundle Size');
            if (!bundle?.report) {
              core.setOutput('body', '## 📦 Bundle Size (client-toss)\n\n번들 측정 결과가 없어요.');
              return;
            }
            const { web, budgets, reference } = bundle.report;
            const kib = (b) => `${(b / 1024).toFixed(1)} KiB`;
            const mb = (b) => `${(b / 1024 / 1024).toFixed(2)} MB`;
            const pct = (u, t) => `${((u / t) * 100).toFixed(1)}%`;
            const mark = (u, t) => (u > t ? '❌' : '✅');

            const rows = web.files.slice(0, 10).map((f) =>
              `| \`${f.relPath}\` | ${kib(f.raw)} | ${kib(f.gzip)} | ${kib(f.transfer)} |`).join('\n');
            const rest = web.files.length - Math.min(10, web.files.length);

            const body = [
              '## 📦 Bundle Size (client-toss)',
              '',
              '| 버킷 | 크기 | 예산 | 사용률 | |',
              '|---|---:|---:|---:|:--:|',
              `| JS+CSS (gzip) | ${kib(web.codeGzip)} | ${kib(budgets.codeGzip)} | ${pct(web.codeGzip, budgets.codeGzip)} | ${mark(web.codeGzip, budgets.codeGzip)} |`,
              `| 전송량 합 | ${kib(web.transfer)} | ${kib(budgets.transfer)} | ${pct(web.transfer, budgets.transfer)} | ${mark(web.transfer, budgets.transfer)} |`,
              `| 소스맵 | ${web.sourceMapCount}개 | 0개 | — | ${web.sourceMapCount > 0 ? '❌' : '✅'} |`,
              '',
              `<details><summary>dist/web 파일별 내역 (${web.fileCount}개)</summary>`,
              '',
              '| 파일 | raw | gzip | 전송량 |',
              '|---|---:|---:|---:|',
              rows,
              rest > 0 ? `| _그 외 ${rest}개_ | | | |` : '',
              '</details>',
              '',
              reference?.rnBundles
                ? `> 참고(게이트 대상 아님) — RN 셸 번들 ${reference.rnBundles.count}개 ${mb(reference.rnBundles.bytes)}, 소스맵 ${reference.sourceMaps.count}개 ${mb(reference.sourceMaps.bytes)}. 빌드마다 최대 1.8MB 변동해 게이트하지 않아요.`
                : '',
              '',
              '> gzip level 9 기준. webp처럼 이미 압축된 파일은 `min(raw, gzip)`으로 계산해요.',
            ].join('\n');

            // GitHub 코멘트 상한(65,536자) 아래로 고정한다.
            const MAX = 60000;
            core.setOutput('body', body.length > MAX
              ? body.slice(0, MAX) + '\n\n> ⚠️ 리포트가 길어 잘랐어요.'
              : body);

      - name: Comment Bundle Size
        if: always() && github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: bundle-size
          skip_unchanged: true
          message: ${{ steps.qa-report.outputs.body }}

  server-toss:
    name: Server-Toss
    needs: changes
    if: >-
      github.event_name == 'push' ||
      contains(fromJSON(needs.changes.outputs.affected), 'server-toss')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      - name: Lint
        working-directory: server-toss
        run: pnpm run lint

      - name: Format Check
        working-directory: server-toss
        run: pnpm run format:check

      - name: Test with Coverage
        working-directory: server-toss
        run: pnpm run test:cov

      - name: Build
        working-directory: server-toss
        run: pnpm run build

  # 게임(client + server)의 실시간 멀티플레이 통합 검증.
  #
  # playwright.config.ts에는 이미 `process.env.CI` 분기로 dev 서버 두 개를 띄우는
  # webServer 설정이 있었지만, 이걸 실행하는 워크플로가 없어 한 번도 돌지 않았다.
  # 스펙 5개(방 생성·중도 입장·이탈·재시작·초대 링크)가 로컬에서만 존재했다.
  e2e:
    name: E2E
    needs: changes
    # 게임 클라이언트나 서버가 영향받을 때만 돈다 — 판정은 changes 잡이 이미 했다.
    if: >-
      github.event_name == 'push' ||
      contains(fromJSON(needs.changes.outputs.affected), 'client') ||
      contains(fromJSON(needs.changes.outputs.affected), 'server')
    runs-on: ubuntu-latest
    # 서버가 방 상태를 Redis에 둔다. 로컬 infra/local/compose.yaml과 같은 이미지.
    services:
      redis:
        image: redis:7.2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      # webServer 분기를 켜는 스위치. 이게 없으면 dev 서버를 띄우지 않아
      # 테스트가 빈 localhost에 붙는다.
      CI: "true"
      NODE_ENV: test
      PORT: "3000"
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ""
      CORS_ORIGIN: http://localhost:5173

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # server는 @shared/types의 dist를 참조하므로 패키지 빌드가 필요하다.
      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      # chromium만 받는다. 3종(chromium/firefox/webkit)을 다 돌리면 스펙 5개 x 3배가 되고,
      # 이 게임은 실시간 동작 검증이 목적이라 브라우저 간 렌더 차이가 관심사가 아니다.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run E2E
        run: pnpm test:e2e --project=chromium

      # 실패했을 때야말로 리포트가 필요하다. trace는 config에서 on-first-retry.
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # 브랜치 보호의 required status check로 지정할 **단 하나의** 잡.
  #
  # 개별 잡을 required로 걸면 안 되는 이유:
  # 이 파이프라인은 영향받는 워크스페이스만 실행하므로 나머지 잡은 스킵된다.
  # 스킵된 잡은 체크를 보고하지 않아, required로 걸면 PR이
  # "Expected — Waiting for status to be reported"에서 영구히 멈춘다.
  # 항상 도는 집계 잡 하나만 required로 거는 것이 정석이다.
  #
  # 설정: Settings → Rules → protect_main&dev → Require status checks → "CI Gate"
  # E2E는 아직 needs에 넣지 않는다.
  # 로컬 CI 조건 실행 결과 9개 중 8개 통과, 1개는 테스트 로케이터 문제로 실패했다.
  # 검증이 끝나지 않은 잡을 required check에 묶으면 팀 전원의 머지가 막힌다.
  # E2E가 안정적으로 통과하는 것을 확인한 뒤 이 목록에 추가한다.
  ci-gate:
    name: CI Gate
    needs: [changes, client, server, client-toss, server-toss]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report job results
        run: |
          echo "changes:     ${{ needs.changes.result }}"
          echo "client:      ${{ needs.client.result }}"
          echo "server:      ${{ needs.server.result }}"
          echo "client-toss: ${{ needs.client-toss.result }}"
          echo "server-toss: ${{ needs.server-toss.result }}"

      # 스킵은 통과로 본다 — 영향 없는 워크스페이스가 안 도는 것은 정상이다.
      # 실패·취소만 막는다. changes 잡이 실패하면(영향 계산 실패) 여기서 걸리므로,
      # 계산이 깨진 채로 "아무 잡도 안 돌아서 초록불"이 되는 경로가 닫힌다.
      - name: Fail if any job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "::error::하나 이상의 잡이 실패했거나 취소되었습니다."
          exit 1

  notify:
    name: Slack Notification
    needs: [changes, client, server, client-toss, server-toss]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Slack Notification
        uses: 8398a7/action-slack@v3
        with:
          status: |
            ${{
              (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
              && 'failure' || 'success'
            }}
          fields: repo,message,commit,author,action,eventName,ref,workflow
          mention: "here"
          if_mention: failure
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  security-audit:
    name: Security Audit Report
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.action == 'opened'

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Client Security Audit
        id: client-audit
        working-directory: client
        run: |
          pnpm install --frozen-lockfile
          pnpm audit --audit-level=high 2>&1 | tee audit-output.txt || true
          echo "result<<EOF" >> $GITHUB_OUTPUT
          # 리포트 스크립트가 어차피 앞 2000자만 사용한다. 전체 출력을 GITHUB_OUTPUT으로
          # 흘리면 후속 스텝(github-script)의 env 크기가 ARG_MAX를 넘겨 spawn이 실패하므로 절단한다.
          head -c 2000 audit-output.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Server Security Audit
        id: server-audit
        working-directory: server
        run: |
          pnpm install --frozen-lockfile
          pnpm audit --audit-level=high 2>&1 | tee audit-output.txt || true
          echo "result<<EOF" >> $GITHUB_OUTPUT
          # 리포트 스크립트가 어차피 앞 2000자만 사용한다. 전체 출력을 GITHUB_OUTPUT으로
          # 흘리면 후속 스텝(github-script)의 env 크기가 ARG_MAX를 넘겨 spawn이 실패하므로 절단한다.
          head -c 2000 audit-output.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Post Security Audit Report
        uses: actions/github-script@v8
        continue-on-error: true
        env:
          CLIENT_AUDIT: ${{ steps.client-audit.outputs.result }}
          SERVER_AUDIT: ${{ steps.server-audit.outputs.result }}
        with:
          script: |
            const clientOutput = process.env.CLIENT_AUDIT || '';
            const serverOutput = process.env.SERVER_AUDIT || '';

            const clientIcon = clientOutput.includes('0 vulnerabilities') ? '✅' : '⚠️';
            const serverIcon = serverOutput.includes('0 vulnerabilities') ? '✅' : '⚠️';

            const escapeMarkdown = (str) => str.slice(0, 2000).replace(/`/g, '\\`').replace(/\$/g, '\\$');

            const body = `## 🔒 Security Audit Report

            ### ${clientIcon} Client
            \`\`\`
            ${escapeMarkdown(clientOutput)}
            \`\`\`

            ### ${serverIcon} Server
            \`\`\`
            ${escapeMarkdown(serverOutput)}
            \`\`\`
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
