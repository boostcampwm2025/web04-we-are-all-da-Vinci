name: Deploy Backend

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop
      - chore/web-server-gcp
    paths:
      - "server/**"
      - "packages/shared/**"
      - ".github/workflows/deploy-backend.yml"
      - "deploy/**"

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GCP_REGION: ${{ vars.GCP_REGION }}
  WORKLOAD_IDENTITY_PROVIDER: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
  ARTIFACT_REPOSITORY: ${{ vars.WEB_ARTIFACT_REPOSITORY }}
  CLOUD_RUN_SERVICE: ${{ vars.WEB_CLOUD_RUN_SERVICE }}
  DEPLOY_SERVICE_ACCOUNT: ${{ vars.WEB_DEPLOY_SERVICE_ACCOUNT }}

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Validate deployment configuration
        run: |
          set -euo pipefail
          required=(
            GCP_PROJECT_ID 
            GCP_REGION 
            ARTIFACT_REPOSITORY 
            CLOUD_RUN_SERVICE
            DEPLOY_SERVICE_ACCOUNT 
            WORKLOAD_IDENTITY_PROVIDER
          )
          for name in "${required[@]}"; do
            if [ -z "${!name}" ]; then
              echo "Missing GitHub Actions variable: ${name}"
              exit 1
            fi
          done

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud with WIF
        uses: google-github-actions/auth@v3
        with:
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          version: ">= 541.0.0"

      - name: Configure Artifact Registry authentication
        run: |
          gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Set image URI
        run: |
          IMAGE_URI="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${ARTIFACT_REPOSITORY}/server:${GITHUB_SHA}"
          echo "IMAGE_URI=${IMAGE_URI}" >> "$GITHUB_ENV"

      - name: Build image
        run: |
          docker buildx build \
            -t "${IMAGE_URI}" \
            -f ./server/Dockerfile \
            .

      - name: Push image
        run: |
          docker push "${IMAGE_URI}"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "${CLOUD_RUN_SERVICE}" \
            --project="${GCP_PROJECT_ID}" \
            --region="${GCP_REGION}" \
            --image="${IMAGE_URI}" \
            --quiet
